name: Deploy to Production

on:
  workflow_run:
    workflows: ['Docker Build & Publish']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual deployment)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-production:
    name: Deploy to Production Server
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$WORKFLOW_BRANCH"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Deploy via SSH
        if: ${{ !inputs.dry_run }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # La clé est restreinte côté prod à la commande forcée
          # mypacer_infra/scripts/deploy-scraper.sh (pull, up --no-deps,
          # vérification running) : ce script est ignoré par le serveur.
          script: deploy-scraper

      - name: Dry run info
        if: ${{ inputs.dry_run }}
        run: |
          echo "🧪 DRY RUN MODE - No actual deployment performed"
          echo "Would deploy version: ${{ steps.version.outputs.version }}"
          echo "Target: Production"
          echo "Container: scraper"

      - name: Notify deployment success
        if: ${{ !inputs.dry_run }}
        run: |
          echo "🎉 Successfully deployed ${{ steps.version.outputs.version }} to production!"
          echo "🔄 Scraper will run according to its cron schedule"
